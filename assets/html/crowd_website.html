}

function draw() {
  if (!W) return;
  const t = Math.min(pos, F - 1), f = Math.floor(t), a = t - f, g = Math.min(f + 1, F - 1);
  for (let k = 0; k < S; k++) px[k] = P[f*S + k]*(1 - a) + P[g*S + k]*a;   // interpolation
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = 'round';

  // décor : murs (segments, plans) et piliers (disques)
  ctx.strokeStyle = T.wall; ctx.fillStyle = T.wall + '33'; ctx.lineWidth = 3;
  for (const o of D.decor) {
    ctx.beginPath();
    if (o[0] === 's') { ctx.moveTo(X(o[1]), Y(o[2])); ctx.lineTo(X(o[3]), Y(o[4])); }
    else if (o[0] === 'd') { ctx.arc(X(o[1]), Y(o[2]), o[3]*s, 0, 2*Math.PI); ctx.fill(); }
    else { const L = 1e5; ctx.moveTo(X(o[1]) - o[4]*L, Y(o[2]) - o[3]*L);
           ctx.lineTo(X(o[1]) + o[4]*L, Y(o[2]) + o[3]*L); }
    ctx.stroke();
  }

  // traces courtes, qui s'estompent
  const f0 = Math.max(0, f - D.trail);
  ctx.lineWidth = 1.5;
  for (let k = 0; k < N; k++) {
    ctx.strokeStyle = T.agents[k % T.agents.length];
    for (let h = f0; h <= f; h++) {
      const x0 = P[h*S + 2*k], y0 = P[h*S + 2*k + 1];
      const x1 = h < f ? P[(h+1)*S + 2*k] : px[2*k], y1 = h < f ? P[(h+1)*S + 2*k + 1] : px[2*k + 1];
      ctx.globalAlpha = 0.45 * (h - f0 + 1) / (f - f0 + 1);
      ctx.beginPath(); ctx.moveTo(X(x0), Y(y0)); ctx.lineTo(X(x1), Y(y1)); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // agents
  for (let k = 0; k < N; k++) {
    const c = T.agents[k % T.agents.length];
    ctx.beginPath(); ctx.arc(X(px[2*k]), Y(px[2*k + 1]), D.r[k]*s, 0, 2*Math.PI);
    ctx.fillStyle = c + '55'; ctx.fill(); ctx.strokeStyle = c; ctx.stroke();
  }

  // contacts actifs : un point à l'endroit du contact
  const row = D.C[a < 0.5 ? f : g];
  if (row) {
    ctx.fillStyle = T.contact;
    for (let m = 0; m < row.length; m += 2) {
      const i = row[m], j = row[m + 1], xi = px[2*i], yi = px[2*i + 1];
      let p;
      if (j < N) { const dx = px[2*j] - xi, dy = px[2*j + 1] - yi, d = Math.hypot(dx, dy) || 1;
                   p = [xi + dx/d*D.r[i], yi + dy/d*D.r[i]]; }
      else p = closest(D.decor[j - N], xi, yi);
      ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1]), 2.5, 0, 2*Math.PI); ctx.fill();
    }
  }

  if (!playing) {                        // petit triangle « lecture » quand c'est en pause
    ctx.fillStyle = T.wall; ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.moveTo(12, 12); ctx.lineTo(26, 21); ctx.lineTo(12, 30); ctx.closePath();
    ctx.fill(); ctx.globalAlpha = 1;
  }
}

function tick(now) {
  if (playing && seen && last !== null) {
    pos += Math.min(now - last, 100) / 1000 * FPS;
    if (pos > F - 1 + HOLD) pos = 0;
    draw();
  }
  last = now; requestAnimationFrame(tick);
}

cv.addEventListener('click', () => { playing = !playing; draw(); });
if ('IntersectionObserver' in window)    // hors de l'écran : on ne calcule rien
  new IntersectionObserver(es => { seen = es[0].isIntersecting; }).observe(cv);
try { new MutationObserver(setTheme).observe(parent.document.documentElement,
        { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setTheme);
addEventListener('resize', resize);
setTheme(); resize(); requestAnimationFrame(tick);
</script></body></html>
